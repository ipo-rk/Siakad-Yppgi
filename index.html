<!DOCTYPE html>
<html lang="id" x-data="app()" :class="{ 'dark': darkMode }">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Siakad SMP YPPGI Bomou</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="assets/css/login.css">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#1e40af',
                        primaryDark: '#1e3a8a',
                        accent: '#10b981',
                    }
                }
            }
        }
    </script>

</head>

<body class="min-h-screen flex items-center justify-center font-sans antialiased p-4">

    <div
        class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl shadow-2xl border border-slate-200 dark:border-slate-700 overflow-hidden">

        <div class="p-8 text-center">
            <i class="fas fa-graduation-cap text-5xl text-accent mb-4"></i>
            <h1 class="text-2xl font-bold text-primary dark:text-indigo-400">Siakad SMP YPPGI BETHANI Bomou</h1>
            <p class="text-slate-500 dark:text-slate-400 mt-1">Sistem Informasi Akademik</p>
        </div>

        <!-- Tombol Role - Versi Perbaikan -->
        <div class="px-6 pb-8 grid grid-cols-2 gap-4">
            <!-- Admin -->
            <button @click="selectRole('admin')"
                class="group relative flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-indigo-50 to-indigo-100 dark:from-indigo-950/50 dark:to-indigo-900/30 border border-indigo-200 dark:border-indigo-700 hover:border-indigo-400 dark:hover:border-indigo-500 transition-all duration-300 hover:shadow-lg hover:shadow-indigo-200/50 dark:hover:shadow-indigo-900/30 overflow-hidden">
                <div
                    class="absolute inset-0 bg-indigo-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
                <i
                    class="fas fa-user-shield text-4xl text-indigo-600 dark:text-indigo-400 mb-3 transform group-hover:scale-110 transition-transform duration-300"></i>
                <span class="font-semibold text-indigo-800 dark:text-indigo-300 text-base">Admin</span>
                <span class="text-xs text-indigo-500 dark:text-indigo-400 mt-1">Full Akses</span>
            </button>

            <!-- Operator -->
            <button @click="selectRole('operator')"
                class="group relative flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-emerald-50 to-emerald-100 dark:from-emerald-950/50 dark:to-emerald-900/30 border border-emerald-200 dark:border-emerald-700 hover:border-emerald-400 dark:hover:border-emerald-500 transition-all duration-300 hover:shadow-lg hover:shadow-emerald-200/50 dark:hover:shadow-emerald-900/30">
                <div
                    class="absolute inset-0 bg-emerald-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
                <i
                    class="fas fa-user-cog text-4xl text-emerald-600 dark:text-emerald-400 mb-3 transform group-hover:scale-110 transition-transform duration-300"></i>
                <span class="font-semibold text-emerald-800 dark:text-emerald-300 text-base">Operator</span>
                <span class="text-xs text-emerald-500 dark:text-emerald-400 mt-1">Kelola Data</span>
            </button>

            <!-- Guru -->
            <button @click="selectRole('guru')"
                class="group relative flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-blue-50 to-blue-100 dark:from-blue-950/50 dark:to-blue-900/30 border border-blue-200 dark:border-blue-700 hover:border-blue-400 dark:hover:border-blue-500 transition-all duration-300 hover:shadow-lg hover:shadow-blue-200/50 dark:hover:shadow-blue-900/30">
                <div
                    class="absolute inset-0 bg-blue-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
                <i
                    class="fas fa-chalkboard-teacher text-4xl text-blue-600 dark:text-blue-400 mb-3 transform group-hover:scale-110 transition-transform duration-300"></i>
                <span class="font-semibold text-blue-800 dark:text-blue-300 text-base">Guru</span>
                <span class="text-xs text-blue-500 dark:text-blue-400 mt-1">Input Nilai</span>
            </button>

            <!-- Siswa -->
            <button @click="selectRole('siswa')"
                class="group relative flex flex-col items-center justify-center p-6 rounded-2xl bg-gradient-to-br from-purple-50 to-purple-100 dark:from-purple-950/50 dark:to-purple-900/30 border border-purple-200 dark:border-purple-700 hover:border-purple-400 dark:hover:border-purple-500 transition-all duration-300 hover:shadow-lg hover:shadow-purple-200/50 dark:hover:shadow-purple-900/30">
                <div
                    class="absolute inset-0 bg-purple-500/5 opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                </div>
                <i
                    class="fas fa-user-graduate text-4xl text-purple-600 dark:text-purple-400 mb-3 transform group-hover:scale-110 transition-transform duration-300"></i>
                <span class="font-semibold text-purple-800 dark:text-purple-300 text-base">Siswa</span>
                <span class="text-xs text-purple-500 dark:text-purple-400 mt-1">Lihat Nilai</span>
            </button>
        </div>
        <!-- Form Login -->
        <form @submit.prevent="login" class="px-8 pb-8 space-y-5">
            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Username / NIP /
                    NIS</label>
                <input type="text" x-model="username" id="usernameInput"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                    placeholder="Contoh: admin / guru1 / siswa21001" required>
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                <input type="password" x-model="password"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-700 focus:ring-2 focus:ring-accent focus:border-accent outline-none transition"
                    required>
            </div>

            <div x-show="error"
                class="text-red-600 dark:text-red-400 text-sm text-center bg-red-50 dark:bg-red-950/30 p-3 rounded-xl"
                x-text="error"></div>

            <button type="submit" :disabled="loading"
                class="w-full py-3 px-4 bg-primary hover:bg-primaryDark text-white font-medium rounded-xl transition disabled:opacity-60 flex items-center justify-center gap-2">
                <span x-show="!loading">Masuk</span>
                <i x-show="loading" class="fas fa-spinner animate-spin"></i>
            </button>

            <div class="text-center mt-4">
                <button type="button" @click="showChangePassword = true"
                    class="text-sm text-accent hover:underline">Ganti Password / Lupa Password?</button>
            </div>
        </form>

        <!-- Modal Ganti Password -->
        <div x-show="showChangePassword" class="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4"
            @click="showChangePassword = false">
            <div @click.stop
                class="bg-white dark:bg-slate-800 rounded-2xl p-8 w-full max-w-md shadow-2xl border border-slate-200 dark:border-slate-700">
                <h2 class="text-xl font-bold mb-6 text-center">Ganti Password</h2>

                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium mb-1">Username / NIP / NIS</label>
                        <input type="text" x-model="changeUsername"
                            class="w-full px-4 py-3 rounded-xl border dark:border-slate-600 bg-white dark:bg-slate-700">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Password Lama</label>
                        <input type="password" x-model="oldPassword"
                            class="w-full px-4 py-3 rounded-xl border dark:border-slate-600 bg-white dark:bg-slate-700">
                    </div>

                    <div>
                        <label class="block text-sm font-medium mb-1">Password Baru</label>
                        <input type="password" x-model="newPassword"
                            class="w-full px-4 py-3 rounded-xl border dark:border-slate-600 bg-white dark:bg-slate-700">
                    </div>

                    <div x-show="changeError" class="text-red-600 text-sm text-center" x-text="changeError"></div>

                    <div class="flex gap-3">
                        <button @click="changePassword()" :disabled="changeLoading"
                            class="flex-1 bg-accent hover:bg-emerald-600 text-white py-3 rounded-xl transition disabled:opacity-60">
                            <span x-show="!changeLoading">Simpan Password Baru</span>
                            <i x-show="changeLoading" class="fas fa-spinner animate-spin"></i>
                        </button>
                        <button @click="showChangePassword = false"
                            class="flex-1 bg-slate-200 dark:bg-slate-700 py-3 rounded-xl">
                            Batal
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="px-8 pb-6 text-center text-xs text-slate-500 dark:text-slate-400">
            <p>Password demo awal semua akun: <strong>password123</strong></p>
        </div>

        <div class="p-4 border-t border-slate-200 dark:border-slate-700 text-center">
            <button @click="darkMode = !darkMode; localStorage.setItem('theme', darkMode ? 'dark' : 'light')"
                class="text-sm text-slate-500 dark:text-slate-400 hover:text-accent transition">
                <i :class="darkMode ? 'fa-sun' : 'fa-moon'" class="fas mr-1"></i>
                <span x-text="darkMode ? 'Light Mode' : 'Dark Mode'"></span>
            </button>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('app', () => ({
                darkMode: localStorage.getItem('theme') === 'dark',
                username: '',
                password: '',
                error: '',
                loading: false,

                // Modal ganti password
                showChangePassword: false,
                changeUsername: '',
                oldPassword: '',
                newPassword: '',
                changeError: '',
                changeLoading: false,

                selectRole(role) {
                    const roleMap = {
                        admin: 'admin',
                        operator: 'operator',
                        guru: 'guru1',
                        siswa: 'siswa21001'
                    };
                    this.username = roleMap[role];
                    this.error = '';
                    setTimeout(() => document.querySelector('input[type="password"]').focus(), 100);
                },

                login() {
                    this.loading = true;
                    this.error = '';

                    if (!this.username.trim()) {
                        this.error = 'Username tidak boleh kosong';
                        this.loading = false;
                        return;
                    }

                    if (this.password !== 'password123') {
                        this.error = 'Password salah (demo: password123)';
                        this.loading = false;
                        return;
                    }

                    const usernameLower = this.username.trim().toLowerCase();
                    let role = 'siswa';

                    if (usernameLower === 'admin') role = 'admin';
                    else if (usernameLower === 'operator') role = 'operator';
                    else if (usernameLower.includes('guru')) role = 'guru';
                    else if (usernameLower.includes('siswa') || /^\d+$/.test(usernameLower)) role = 'siswa';

                    localStorage.setItem('userRole', role);
                    localStorage.setItem('userName', this.username.trim() || 'Pengguna');
                    localStorage.setItem('userId', usernameLower);
                    localStorage.setItem('userPassword', 'password123'); // simulasi simpan password lama

                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 800);
                },

                changePassword() {
                    this.changeLoading = true;
                    this.changeError = '';

                    if (!this.changeUsername.trim() || !this.oldPassword || !this.newPassword) {
                        this.changeError = 'Semua field harus diisi';
                        this.changeLoading = false;
                        return;
                    }

                    if (this.oldPassword !== 'password123') {
                        this.changeError = 'Password lama salah (demo: password123)';
                        this.changeLoading = false;
                        return;
                    }

                    if (this.newPassword.length < 6) {
                        this.changeError = 'Password baru minimal 6 karakter';
                        this.changeLoading = false;
                        return;
                    }

                    // Simulasi sukses
                    localStorage.setItem('userPassword', this.newPassword); // update password demo
                    this.changeError = '';
                    alert('Password berhasil diganti! Silakan login ulang dengan password baru.');
                    this.showChangePassword = false;
                    this.changeLoading = false;

                    // Reset form
                    this.changeUsername = '';
                    this.oldPassword = '';
                    this.newPassword = '';
                }
            }));
        });
    </script>

    <style>
        .role-btn {
            @apply flex flex-col items-center gap-2 p-4 rounded-xl transition border;
        }

        .role-btn.admin {
            @apply bg-indigo-50 dark:bg-indigo-950/40 border-indigo-200 dark:border-indigo-800 hover:bg-indigo-100;
        }

        .role-btn.operator {
            @apply bg-emerald-50 dark:bg-emerald-950/40 border-emerald-200 dark:border-emerald-800 hover:bg-emerald-100;
        }

        .role-btn.guru {
            @apply bg-blue-50 dark:bg-blue-950/40 border-blue-200 dark:border-blue-800 hover:bg-blue-100;
        }

        .role-btn.siswa {
            @apply bg-purple-50 dark:bg-purple-950/40 border-purple-200 dark:border-purple-800 hover:bg-purple-100;
        }
    </style>
</body>

</html>
